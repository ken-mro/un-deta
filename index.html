<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="うんちが出たかどうかだけを、1タップで記録する日記アプリ。">
  <title>うん、出た。</title>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">うん、出た。</h1>
    <p class="today" data-testid="today"></p>
  </header>

  <main class="app-main">
    <section class="record" aria-labelledby="record-heading">
      <h2 id="record-heading" class="visually-hidden">今日の記録</h2>
      <p class="today-status" data-testid="today-status" role="status" aria-live="polite"></p>
      <div class="celebration" data-testid="celebration" aria-hidden="true" hidden>
        <span class="celebration-text"></span>
        <span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span>
      </div>
      <div class="record-buttons">
        <button type="button" class="btn-done" id="btn-done" aria-pressed="false">出た</button>
        <button type="button" class="btn-not-yet" id="btn-not-yet" aria-pressed="false">出てない</button>
      </div>
      <p class="streak" data-testid="streak" hidden>「出てない」が <strong class="streak-count"></strong> 続いています</p>
      <button type="button" class="btn-link" id="btn-clear-today" hidden>今日の記録を取り消す</button>
      <p class="save-error" id="save-error" role="alert" hidden>記録を保存できませんでした。ブラウザの設定（プライベートブラウズなど）をご確認ください。</p>
    </section>

    <section class="history" aria-labelledby="history-heading">
      <h2 id="history-heading">これまでの記録</h2>
      <p class="hint">日付をタップすると、あとから修正・取り消しできます。</p>
      <div class="heatmap-scroll" id="heatmap"></div>
      <ul class="legend" aria-label="凡例">
        <li><span class="legend-swatch" data-status="1" aria-hidden="true"></span>出た</li>
        <li><span class="legend-swatch" data-status="2" aria-hidden="true"></span>出てない</li>
        <li><span class="legend-swatch" data-status="0" aria-hidden="true"></span>未記録</li>
      </ul>
    </section>
  </main>

  <dialog class="day-dialog" id="day-dialog" aria-labelledby="day-dialog-title">
    <h2 id="day-dialog-title" class="day-dialog-title"></h2>
    <p class="day-dialog-current" id="day-dialog-current"></p>
    <div class="day-dialog-actions">
      <button type="button" class="btn-done-small" data-set="1">出た</button>
      <button type="button" class="btn-not-yet" data-set="2">出てない</button>
      <button type="button" class="btn-link" data-set="0">記録を消す</button>
      <button type="button" class="btn-link" data-action="cancel">キャンセル</button>
    </div>
  </dialog>
</body>
</html>
